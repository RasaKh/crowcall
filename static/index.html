<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>crowcall</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
  /* ------------------------------------------------------------------
     Three type registers, deliberately. An all-monospace panel reads as
     undifferentiated noise, which is the opposite of useful when you are
     scanning for one number.

       --display  serif, for headings. Radio log books and equipment
                  nameplates were set in serif; it also gives the strongest
                  possible contrast against the data.
       --mono     anything you compare column to column: bitrates, chunk
                  counts, timestamps, callsigns. Alignment is the point.
       --sans     prose. Message bodies and anything read as a sentence.

     No webfonts anywhere. A tool built for the absence of infrastructure
     should not need a CDN to render.
     ------------------------------------------------------------------ */
  :root{
    --chassis:#161e27; --panel:#1e2933; --raised:#26323e;
    --patina:#6f9a8d; --brass:#c08a3e; --phosphor:#ffb547;
    --alarm:#d4563f; --ink:#e3eaee; --dim:#8697a4;
    --display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",
              Georgia,"DejaVu Serif","Liberation Serif",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"DejaVu Sans",sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--chassis);color:var(--ink);
       font-family:var(--sans);font-size:15px;line-height:1.55}
  /* faint ruling, like a paper signals log under the panels. 30px must stay
     in step with the body line-height or the lines fight the text. */
  body::before{content:"";position:fixed;inset:0;pointer-events:none;
    background:repeating-linear-gradient(transparent 0 29px,
      rgba(111,154,141,.045) 29px 30px);z-index:0}
  .wrap{position:relative;z-index:1;max-width:1520px;margin:0 auto;
        padding:22px 18px 60px}

  header{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;
    border-bottom:1px solid var(--raised);padding-bottom:13px;margin-bottom:22px}
  h1{font-family:var(--display);font-size:27px;font-weight:600;margin:0;
     letter-spacing:.04em;color:var(--patina)}
  .call{font-family:var(--mono);font-size:29px;color:var(--phosphor);
        letter-spacing:.05em}
  .spec{font-family:var(--mono);font-size:12px;color:var(--dim);
        margin-left:auto;text-align:right;letter-spacing:.03em;line-height:1.7}

  /* Three columns: compose on the left, traffic in the middle where the eye
     lands, instruments on the right. The middle column is the only one that
     grows -- minmax(0,1fr) rather than 1fr so a long string cannot widen it. */
  .cols{display:grid;grid-template-columns:330px minmax(0,1fr) 320px;
        gap:20px;align-items:start}
  .cols > *{min-width:0}
  @media(max-width:1240px){
    .cols{grid-template-columns:320px minmax(0,1fr)}
    .cols > .instr{grid-column:1 / -1;display:grid;
      grid-template-columns:1fr 1fr;gap:20px;align-items:start}
  }
  @media(max-width:820px){
    .cols{grid-template-columns:minmax(0,1fr)}
    .cols > .instr{grid-template-columns:minmax(0,1fr)}
  }

  .card{background:var(--panel);border:1px solid var(--raised);
        border-radius:3px;padding:16px;margin-bottom:18px;
        min-width:0;overflow:hidden}
  .instr .card:last-child{margin-bottom:0}
  .lab{font-family:var(--display);font-size:15px;font-weight:600;
       letter-spacing:.03em;color:var(--brass);margin:0 0 12px}

  button{font-family:var(--mono);font-size:13px;letter-spacing:.09em;
    text-transform:uppercase;background:var(--raised);color:var(--ink);
    border:1px solid #33424f;border-radius:2px;padding:9px 14px;cursor:pointer}
  button:hover:not(:disabled){border-color:var(--patina);color:var(--phosphor)}
  button:disabled{opacity:.4;cursor:default}
  button:focus-visible{outline:2px solid var(--phosphor);outline-offset:2px}

  #rec{width:100%;padding:20px;font-size:15px;letter-spacing:.14em;
       border-color:var(--patina)}
  #rec.on{background:var(--alarm);border-color:var(--alarm);color:#fff;
          animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.62}}
  @media(prefers-reduced-motion:reduce){#rec.on{animation:none}}
  .meter{height:3px;background:var(--raised);margin-top:9px;overflow:hidden}
  .meter i{display:block;height:100%;width:0;background:var(--phosphor);
           transition:width .08s linear}

  /* knob: fixed label column, elastic track, fixed value column. min-width:0
     on the track is load-bearing -- flex items default to min-width:auto and
     refuse to shrink below their content, which pushes them out of the card. */
  .knob{display:flex;align-items:center;gap:10px;margin:11px 0;
        font-family:var(--mono);font-size:12px;color:var(--dim)}
  .knob span:first-child{flex:0 0 92px;letter-spacing:.05em}
  .knob input[type=range]{flex:1;min-width:0;accent-color:var(--patina)}
  .knob b{flex:0 0 58px;text-align:right;color:var(--ink);font-weight:500}
  .toggle{display:flex;align-items:center;gap:9px;font-family:var(--sans);
    font-size:13px;color:var(--dim);margin:9px 0;cursor:pointer;line-height:1.4}
  .toggle input{accent-color:var(--patina);flex:0 0 auto}

  .field{margin:14px 0 4px}
  .field label{display:block;font-family:var(--mono);font-size:12px;
    color:var(--dim);letter-spacing:.05em;margin-bottom:6px}
  select{display:block;width:100%;min-width:0;font-family:var(--mono);
    font-size:12px;background:var(--raised);color:var(--ink);
    border:1px solid #33424f;border-radius:2px;padding:6px 7px}
  select:focus-visible{outline:2px solid var(--phosphor);outline-offset:1px}
  .hint{font-family:var(--mono);font-size:11px;color:var(--dim);
    letter-spacing:.03em;margin-top:6px;line-height:1.65}
  .hint .warn{color:var(--brass)}
  .cliff{font-family:var(--mono);font-size:11px;color:var(--dim);
    margin:-4px 0 9px 102px;letter-spacing:.03em}
  .cliff b{color:var(--alarm);font-weight:500}

  textarea{width:100%;min-width:0;background:#141c24;color:var(--ink);
    border:1px solid #2f3f4b;border-radius:2px;padding:10px;resize:vertical;
    font-family:var(--sans);font-size:14.5px;line-height:1.55;min-height:72px}
  textarea:focus-visible{outline:2px solid var(--patina);outline-offset:0}
  .row2{display:flex;gap:10px;align-items:center;margin-top:10px}
  .row2 button{flex:0 0 auto}
  .cost{flex:1;min-width:0;font-family:var(--mono);font-size:11px;
    color:var(--dim);letter-spacing:.03em;line-height:1.5}
  .cost b{color:var(--phosphor);font-weight:500}
  .cost .slow{color:var(--alarm)}
  .filepick{display:flex;align-items:center;gap:10px;margin-top:4px}
  .filepick label{font-family:var(--mono);font-size:13px;letter-spacing:.09em;
    text-transform:uppercase;background:var(--raised);color:var(--ink);
    border:1px solid #33424f;border-radius:2px;padding:9px 14px;cursor:pointer}
  .filepick label:hover{border-color:var(--patina);color:var(--phosphor)}
  .filepick input{position:absolute;width:1px;height:1px;opacity:0}
  .filepick input:focus-visible + label{outline:2px solid var(--phosphor)}
  .filepick span{font-family:var(--mono);font-size:11px;color:var(--dim);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* THE SIGNATURE ELEMENT: punched paper tape, one cell per chunk.
       dark        never arrived
       amber       arrived first time
       hatched     recovered by a repair round
       red outline missing at finalisation
     flex-basis 10px with flex-grow means it fills the row for a short
     message and scrolls for a long one, rather than becoming unreadably thin. */
  .tape{display:flex;gap:2px;margin:12px 0 7px;padding:6px 5px;
    background:#121920;border-top:1px solid #2c3945;
    border-bottom:1px solid #2c3945;overflow-x:auto}
  .tape i{flex:1 0 10px;height:29px;border-radius:1px;background:#1b242d;
    box-shadow:inset 0 0 0 1px #232f39}
  .tape i.ok{background:var(--phosphor);box-shadow:0 0 5px rgba(255,181,71,.4)}
  .tape i.repaired{background:var(--patina);
    background-image:repeating-linear-gradient(45deg,
      rgba(0,0,0,.32) 0 2px,transparent 2px 4px)}
  .tape i.lost{background:#1b242d;box-shadow:inset 0 0 0 1px var(--alarm)}
  .tape i.tx{background:#40525f}

  .msg{border-left:2px solid var(--raised);padding:12px 0 12px 15px;
       margin-bottom:16px}
  .msg.degraded{border-left-color:var(--alarm)}
  .msg.clean{border-left-color:var(--patina)}
  .msg .top{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap;
    font-family:var(--mono);font-size:12px;color:var(--dim);letter-spacing:.04em}
  .msg .who{font-family:var(--mono);font-size:17px;color:var(--phosphor);
    letter-spacing:.09em}
  .msg .note{font-family:var(--sans);font-size:13.5px;color:var(--dim);
    margin-top:3px}
  .msg .note b{color:var(--alarm);font-weight:600}
  .rate{font-family:var(--mono);font-size:11px;letter-spacing:.07em;
    padding:2px 7px;border:1px solid var(--brass);color:var(--brass);
    border-radius:2px;white-space:nowrap;cursor:help}
  .rate.other{border-color:var(--phosphor);color:var(--phosphor);
    background:rgba(255,181,71,.08)}
  audio{width:100%;margin-top:10px;height:34px;
    filter:invert(.88) hue-rotate(180deg)}

  .body{margin-top:10px;padding:11px 13px;background:#141c24;
    border-left:2px solid var(--patina);font-family:var(--sans);
    font-size:14.5px;line-height:1.6;white-space:pre-wrap;
    word-break:break-word;max-height:300px;overflow:auto}
  .body.broken{border-left-color:var(--alarm)}
  .filecard{display:flex;align-items:center;gap:11px;margin-top:10px;
    padding:11px 13px;background:#141c24;border-left:2px solid var(--patina)}
  .filecard.broken{border-left-color:var(--alarm)}
  .filecard .fname{font-family:var(--mono);font-size:13px;color:var(--ink);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .filecard .fmeta{font-family:var(--mono);font-size:11px;color:var(--dim);
    margin-left:auto;white-space:nowrap}
  .filecard a{font-family:var(--mono);font-size:11px;letter-spacing:.07em;
    text-transform:uppercase;text-decoration:none;color:var(--patina);
    border:1px solid #2f3f4b;border-radius:2px;padding:4px 9px}
  .filecard a:hover{border-color:var(--patina);color:var(--phosphor)}

  .saved{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .saved a{font-family:var(--mono);font-size:11px;letter-spacing:.07em;
    text-transform:uppercase;text-decoration:none;color:var(--patina);
    border:1px solid #2f3f4b;border-radius:2px;padding:4px 8px}
  .saved a:hover{border-color:var(--patina);color:var(--phosphor)}
  .saved a:focus-visible{outline:2px solid var(--phosphor);outline-offset:1px}
  .saved em{font-family:var(--mono);font-size:11px;color:var(--dim);
    font-style:normal;letter-spacing:.03em}

  /* Ether: a normal top-to-bottom log. It fills downward, then scrolls inside
     its own panel instead of overlapping or moving the page. */
  #ether{font-family:var(--mono);font-size:12px;height:340px;overflow-y:scroll;
    overflow-x:hidden;display:flex;flex-direction:column;line-height:1.6;
    overscroll-behavior:contain;scrollbar-gutter:stable}
  #ether div{padding:1px 0;color:var(--dim);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  #ether .rx{color:var(--patina)} #ether .tx{color:var(--phosphor)}
  #ether .drop{color:var(--alarm)} #ether .sys{color:var(--brass)}

  .prompt{background:var(--raised);border:1px solid var(--brass);
    border-radius:3px;padding:15px;margin-bottom:16px}
  .prompt p{margin:0 0 12px;font-size:14.5px}
  .prompt .row{display:flex;gap:9px}
  .empty{font-family:var(--mono);font-size:11.5px;color:var(--dim);
    letter-spacing:.03em;padding:7px 0;line-height:1.6}
  .fade{color:var(--alarm);font-family:var(--mono);font-size:12px;
    letter-spacing:.09em;text-transform:uppercase}
  body.embed .wrap{padding:12px 12px 24px}
  body.embed header{padding-bottom:9px;margin-bottom:14px}
  body.embed h1{font-size:21px}
  body.embed .call{font-size:22px}
  body.embed .cols{gap:14px}
  body.embed .card{padding:12px;margin-bottom:12px}
  #samplebtn{width:100%;margin-top:8px;border-color:var(--brass);color:var(--phosphor)}
  #samplebtn:hover:not(:disabled){border-color:var(--phosphor);background:#2d3b47}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>crowcall</h1>
    <div class="call" id="mycall">----</div>
    <div class="spec" id="spec"></div>
  </header>

  <div class="cols">

    <!-- LEFT: everything you originate. Voice, text, files. -->
    <div class="compose">
      <div class="card">
        <p class="lab">Transmit voice</p>
        <button id="rec">Hold to record</button>
        <button id="samplebtn" hidden>Send sample voice clip</button>
        <div class="meter"><i id="lvl"></i></div>
        <div class="empty" id="txnote">Press and hold, or press space.</div>
      </div>

      <div class="card">
        <p class="lab">Send text</p>
        <textarea id="txt" placeholder="Type a message."></textarea>
        <div class="row2">
          <button id="sendtxt" disabled>Send</button>
          <div class="cost" id="txtcost"></div>
        </div>
      </div>

      <div class="card">
        <p class="lab">Send a file</p>
        <div class="filepick">
          <input type="file" id="fileinput">
          <label for="fileinput">Choose</label>
          <span id="filename">No file chosen</span>
        </div>
        <div class="row2">
          <button id="sendfile" disabled>Send</button>
          <div class="cost" id="filecost"></div>
        </div>
      </div>
    </div>

    <!-- MIDDLE: the traffic log, where the eye lands. -->
    <div class="main">
      <div id="prompts"></div>
      <div class="card">
        <p class="lab">Traffic</p>
        <div id="msgs"><div class="empty">Nothing heard yet.</div></div>
      </div>
    </div>

    <!-- RIGHT: instruments. Things you watch and adjust, not things you
         compose. Collapses to a two-across strip under 1240px. -->
    <div class="instr">
      <div class="card">
        <p class="lab">Channel conditions</p>
        <div class="knob" id="snrknob" hidden><span>Signal</span>
          <input type="range" id="snr" min="0" max="30" step="1" value="20">
          <b id="snrv">20 dB</b></div>
        <div class="cliff" id="cliff" hidden></div>
        <div class="knob" id="lossknob"><span>Static loss</span>
          <input type="range" id="loss" min="0" max="60" step="1" value="0">
          <b id="lossv">0%</b></div>
        <div class="knob"><span>Fade chance</span>
          <input type="range" id="fp" min="0" max="30" step="1" value="0">
          <b id="fpv">0%</b></div>
        <div class="knob"><span>Fade length</span>
          <input type="range" id="fl" min="500" max="12000" step="500" value="3000">
          <b id="flv">3.0s</b></div>
        <label class="toggle"><input type="checkbox" id="auto" checked>
          Answer repair requests automatically</label>
        <label class="toggle"><input type="checkbox" id="pace" checked>
          Pace transmission at radio speed</label>
        <label class="toggle"><input type="checkbox" id="vad" checked>
          Strip silence before sending</label>
        <label class="toggle" id="savewrap"><input type="checkbox" id="save" checked>
          Save messages to disk</label>
        <label class="toggle" id="savemodemwrap"><input type="checkbox" id="savemodem">
          Also save per-burst modem audio</label>
        <div class="hint" id="arch"></div>
        <div class="field">
          <label for="voice">Voice mode</label>
          <select id="voice"></select>
          <div class="hint" id="voicehint"></div>
        </div>
        <div class="field">
          <label for="mode">Codec2 rate</label>
          <select id="mode"></select>
          <div class="hint" id="rt"></div>
        </div>
        <div class="empty" id="fadestate"></div>
      </div>

      <div class="card">
        <p class="lab">Ether</p>
        <div id="ether"></div>
      </div>
    </div>

  </div>
</div>

<script>
const BASE = location.pathname.replace(/\/+$/, '');
const api = p => BASE + p;
if (new URLSearchParams(location.search).get('embed') === '1') {
  document.body.classList.add('embed');
}
const sock = io({ path: BASE + '/socket.io' });
const $ = id => document.getElementById(id);
let CHUNK_S = 1.32, MY_MODE = null, seen = {};

/* ---------- ether log ---------- */
function log(cls, txt){
  const box = $('ether');
  const d = document.createElement('div');
  d.className = cls;
  d.textContent = new Date().toLocaleTimeString([], {hour12:false}) + '  ' + txt;
  // Append in chronological order: every new event occupies its own row and
  // pushes the older rows downward. When the fixed-height panel fills, the
  // browser's own scrollbar handles the rest.
  box.appendChild(d);
  while (box.childElementCount > 120) box.firstChild.remove();
  box.scrollTop = box.scrollHeight;
}

/* ---------- message rows ---------- */
function row(id){
  if (seen[id]) return seen[id];
  const el = document.createElement('div');
  el.className = 'msg';
  el.innerHTML = `<div class="top"><span class="who"></span>
    <span class="rate" hidden></span><span class="meta"></span></div>
    <div class="tape"></div>
    <div class="note"></div><div class="payload"></div>
    <div class="player"></div><div class="saved"></div>`;
  const box = $('msgs');
  if (box.querySelector('.empty')) box.innerHTML = '';
  box.prepend(el);
  seen[id] = el;
  return el;
}
function rate(el, r, aicodix){
  if (!r) return;
  const b = el.querySelector('.rate');
  b.hidden = false;
  // the aicodix mode is what varies per message now, so it leads the badge
  b.textContent = (aicodix || r.modem || '?') + ' \u00b7 ' + r.bps + ' bps';
  b.classList.toggle('other', MY_MODE && r.mode !== MY_MODE);
  const pad = r.overhead_pct > 0
    ? `\npadding : ${r.wire_bps} bps on the wire (${r.overhead_pct}% wasted)` : '';
  b.title =
      `aicodix : ${aicodix || r.modem || '?'}  (role "${r.modem}")\n`
    + `burst   : ${r.usable} B usable in ${r.air_s}s\n`
    + `codec2  : ${r.mode} \u2014 ${r.bytes_s} B/s, ${r.frame_bytes} B per frame\n`
    + `chunk   : ${r.frames} frames = ${r.speech_s}s of speech\n`
    + `on air  : ${r.realtime}x realtime${pad}`
    + (MY_MODE && r.mode !== MY_MODE ? `\n\nyou are set to codec2 ${MY_MODE}` : '');
}

function payload(el, d){
  const box = el.querySelector('.payload');
  const broken = d.intact === false ? ' broken' : '';
  if (d.kind === 'text' && d.text !== undefined){
    box.innerHTML = `<div class="body${broken}"></div>`;
    box.firstChild.textContent = d.text
      + (d.truncated_display ? '\n\n[…truncated for display]' : '');
  } else if (d.kind === 'file'){
    box.innerHTML =
      `<div class="filecard${broken}">`
      + `<span class="fname"></span>`
      + `<a href="${api('/api/payload/' + d.msg_id)}" download>save</a>`
      + `<span class="fmeta">${human(d.bytes||0)}`
      + (d.compression && d.compression !== 'none' ? ' · '+d.compression : '')
      + `</span></div>`;
    box.querySelector('.fname').textContent = d.filename || 'unnamed';
  } else if (d.kind === 'unknown'){
    box.innerHTML = `<div class="body broken"></div>`;
    box.firstChild.textContent = d.error || 'Unrecognised payload.';
  }
}

function saved(el, rec, kind, name){
  // The three artifacts only exist for voice: wav/pcm are decoded speech and
  // .c2 is codec2. A text or file message has none of them -- offering the
  // links anyway would hand out 404s. Each kind gets what it actually has,
  // and the zip is always the whole record including per-burst modem audio.
  if (!rec) return;
  const box = el.querySelector('.saved');
  const u = api('/api/recordings/' + encodeURIComponent(rec));
  let links;
  if (kind === 'text'){
    links = `<a href="${u}/file/message.txt" download title="the message as UTF-8">txt</a>`;
  } else if (kind === 'file'){
    // the archive stores it under its own name inside file/, so link straight
    // to it; fall back to meta.json when the name never arrived
    links = name
      ? `<a href="${u}/file/file/${encodeURIComponent(name)}" download `
        + `title="the file as received">file</a>`
      : `<a href="${u}/file/meta.json" title="mode, chunk map, loss, repair rounds">meta</a>`;
  } else if (kind === 'unknown'){
    links = `<a href="${u}/file/stream.raw" download title="reassembled bytes, holes and all">raw</a>`;
  } else {
    links =
        `<a href="${u}/file/speech.wav" download title="8 kHz mono, what you hear">wav</a>`
      + `<a href="${u}/file/speech.pcm" download title="raw s16le 8 kHz mono">pcm</a>`
      + `<a href="${u}/file/message.c2" download title="codec2 bytes as carried on air">c2</a>`;
  }
  box.innerHTML = `<em>saved</em>` + links
    + `<a href="${u}.zip" title="everything, including per-burst modem audio">zip</a>`;
}

function tape(el, states){
  const t = el.querySelector('.tape');
  if (t.childElementCount !== states.length){
    t.innerHTML = states.map(()=>'<i></i>').join('');
  }
  [...t.children].forEach((c,i)=>{ c.className = states[i]; });
}

/* ---------- outbound ---------- */
sock.on('tx_start', d=>{
  const el = row('tx'+d.msg_id);
  el.querySelector('.who').textContent = 'YOU';
  if (d.kind && d.kind !== 'voice'){
    el.querySelector('.meta').textContent =
      `msg ${d.msg_id} · ${d.kind}`
      + (d.name ? ` · ${d.name}` : '')
      + ` · ${human(d.bytes)}`
      + (d.compression !== 'none' ? ` → ${human(d.carried)} ${d.compression}` : '')
      + ` · ${d.chunks} chunks · ${d.air_human} on air`;
  } else {
    rate(el, d.rate, d.aicodix);
    el.querySelector('.meta').textContent =
      `msg ${d.msg_id} · ${d.chunks} chunks · ${d.speech_s}s speech · ${d.air_s}s on air`;
  }
  tape(el, Array(d.chunks).fill('lost'));
  el.querySelector('.note').textContent = 'Transmitting, interleaved order.';
  log('tx', `TX msg ${d.msg_id}: ${d.chunks} chunks, ${d.air_s}s of air`);
});
sock.on('tx_chunk', d=>{
  const el = seen['tx'+d.msg_id]; if(!el) return;
  const c = el.querySelector('.tape').children[d.idx];
  if (c) c.className = d.repair ? 'repaired' : 'tx';
  el.querySelector('.note').textContent =
    `${d.repair?'Repairing':'Transmitting'} ${d.n}/${d.of} — chunk ${d.idx+1}`;
  log('tx', `  chunk ${d.idx+1} out${d.repair?' (repair)':''}`);
});
sock.on('tx_done', d=>{
  const el = seen['tx'+d.msg_id]; if(!el) return;
  el.classList.add('clean');
  el.querySelector('.note').textContent = d.repair
    ? 'Repair sent.' : 'Sent. Waiting to hear if anything was missed.';
  saved(el, d.record, d.kind, d.name);
  log('tx', `TX msg ${d.msg_id} complete`);
});

/* ---------- inbound ---------- */
sock.on('rx_start', d=>{
  const el = row('rx'+d.msg_id);
  el.querySelector('.who').textContent = d.call;
  if (d.kind && d.kind !== 'voice'){
    el.querySelector('.meta').textContent =
      `msg ${d.msg_id} · incoming ${d.kind} · ${d.chunks} chunks`;
  } else {
    rate(el, d.rate, d.aicodix);
    el.querySelector('.meta').textContent =
      `msg ${d.msg_id} · ${d.chunks} chunks · ${d.seconds}s`;
  }
  tape(el, Array(d.chunks).fill('lost'));
  log('rx', `RX msg ${d.msg_id} from ${d.call}, ${d.kind || 'voice'}, `
           + `${d.chunks} chunks`);
});
sock.on('rx_progress', d=>{
  const el = row('rx'+d.msg_id);
  tape(el, d.strip);
  el.querySelector('.note').textContent = `${d.have} of ${d.of} chunks`;
});
sock.on('rx_done', d=>{
  const el = row('rx'+d.msg_id);
  tape(el, d.strip);
  el.classList.add(d.degraded ? 'degraded' : 'clean');

  if (d.kind && d.kind !== 'voice'){
    el.querySelector('.meta').textContent =
      `msg ${d.msg_id} · ${d.kind} · ${d.of} chunks`;
    const n2 = el.querySelector('.note');
    if (d.kind === 'unknown'){
      n2.innerHTML = `<b>Prefix chunk never arrived.</b> Raw bytes saved.`;
    } else if (d.intact){
      n2.textContent = `Complete — ${human(d.bytes)} verified`
        + (d.repaired ? `, ${d.repaired} chunk${d.repaired>1?'s':''} by repair.` : '.');
    } else {
      n2.innerHTML = `<b>Damaged</b> — ${d.lost} chunk${d.lost>1?'s':''} `
        + `missing (${human(d.lost_bytes||0)}), checksum failed.`
        + (d.error ? ` ${d.error}` : '');
    }
    payload(el, d);
    saved(el, d.record, d.kind, d.filename);
    log(d.intact ? 'rx' : 'drop',
        `RX msg ${d.msg_id} ${d.kind} ${d.intact ? 'intact' : 'DAMAGED'}`);
    return;
  }

  rate(el, d.rate, d.aicodix);
  el.querySelector('.meta').textContent =
    `msg ${d.msg_id} · ${d.seconds}s · ${d.of} chunks`;
  const n = el.querySelector('.note');
  if (d.lost) {
    n.innerHTML = `Playing with <b>${d.lost} chunk${d.lost>1?'s':''} missing</b>` +
      ` (${(d.lost*CHUNK_S).toFixed(1)}s of speech)` +
      (d.repaired?` · ${d.repaired} recovered by repair`:'');
  } else {
    n.textContent = d.repaired
      ? `Complete — ${d.repaired} chunk${d.repaired>1?'s':''} recovered by repair.`
      : 'Complete.';
  }
  el.querySelector('.player').innerHTML =
    `<audio controls preload="auto" src="${api('/api/audio/' + d.msg_id)}"></audio>`;
  saved(el, d.record, 'voice');
  log(d.lost?'drop':'rx',
      `RX msg ${d.msg_id} done — ${d.have}/${d.of}, ${d.loss_pct}% lost`);
});
sock.on('rx_error', d=> log('drop', `RX msg ${d.msg_id} decode failed: ${d.error}`));

/* ---------- repair ---------- */
sock.on('repair_asked', d=>
  log('sys', `asked ${d.call||'sender'} to resend ${d.count}/${d.of} chunks (round ${d.round})`));
sock.on('repair_result', d=>
  log(d.agree?'sys':'drop', d.agree?'sender agreed to repair':'sender declined repair'));
sock.on('repair_answer', d=>
  log('sys', d.agree?`agreed to resend ${d.count} chunks`:'declined repair request'));
sock.on('ether', d=>{
  if (d.dir === 'drop')
    log('drop', `lost ${d.what}${d.what==='DAT'?' chunk '+(d.idx+1):''} — ${d.reason}`);
});
sock.on('station', d=> log('sys', `${d.call} on channel`));

sock.on('repair_request', d=>{
  const div = document.createElement('div');
  div.className = 'prompt';
  div.innerHTML = `<p><strong>${d.call}</strong> missed
    ${d.want.length} of ${d.of} chunks from msg ${d.msg_id}.
    Resending costs about ${d.air_s}s of air.</p>
    <div class="row"><button class="y">Resend</button>
    <button class="n">Decline</button></div>`;
  const answer = agree => {
    fetch(api('/api/repair/'+encodeURIComponent(d.key)), {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({agree})
    });
    div.remove();
  };
  div.querySelector('.y').onclick = ()=>answer(true);
  div.querySelector('.n').onclick = ()=>answer(false);
  $('prompts').append(div);
});

/* ---------- recording ---------- */
let mr=null, chunks=[], stream=null, ac=null, an=null, raf=null;

async function mic(){
  if (stream) return stream;
  stream = await navigator.mediaDevices.getUserMedia({audio:{
    channelCount:1, echoCancellation:true, noiseSuppression:true}});
  ac = new AudioContext(); an = ac.createAnalyser(); an.fftSize = 512;
  ac.createMediaStreamSource(stream).connect(an);
  return stream;
}
function level(){
  const buf = new Uint8Array(an.frequencyBinCount);
  an.getByteTimeDomainData(buf);
  let peak = 0;
  for (const v of buf) peak = Math.max(peak, Math.abs(v-128)/128);
  $('lvl').style.width = Math.min(100, peak*160) + '%';
  raf = requestAnimationFrame(level);
}
async function start(){
  if (mr && mr.state === 'recording') return;
  try { await mic(); }
  catch(e){ $('txnote').textContent = 'Microphone blocked. Allow access and retry.'; return; }
  chunks = [];
  mr = new MediaRecorder(stream, {mimeType:
    MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
      ? 'audio/webm;codecs=opus' : 'audio/ogg'});
  mr.ondataavailable = e => e.data.size && chunks.push(e.data);
  mr.onstop = send;
  mr.start();
  $('rec').classList.add('on');
  $('rec').textContent = 'Recording — release to send';
  raf = requestAnimationFrame(level);
}
function stop(){
  if (mr && mr.state === 'recording') mr.stop();
  $('rec').classList.remove('on');
  $('rec').textContent = 'Hold to record';
  cancelAnimationFrame(raf); $('lvl').style.width = '0';
}
async function send(){
  const blob = new Blob(chunks, {type: mr.mimeType});
  if (blob.size < 1200){ $('txnote').textContent = 'Too short — hold longer.'; return; }
  $('txnote').textContent = 'Encoding…';
  const fd = new FormData(); fd.append('audio', blob, 'r.webm');
  try {
    const r = await fetch(api('/api/send'), {method:'POST', body:fd});
    const j = await r.json();
    if (j.error){ $('txnote').textContent = 'Failed: ' + j.error; }
    else {
      let t = `${j.speech_s}s of speech → ${j.chunks} chunks, `+
              `${j.air_s}s on air (${j.realtime}x).`;
      if (j.stripped_s > 0) t += ` Silence stripped: ${j.stripped_s}s.`;
      $('txnote').textContent = t;
    }
  } catch(e){ $('txnote').textContent = 'Send failed: ' + e.message; }
}

$('samplebtn').onclick = async ()=>{
  $('samplebtn').disabled = true;
  $('txnote').textContent = 'Encoding sample voice…';
  try {
    const r = await fetch(api('/api/sample'), {method:'POST'});
    const j = await r.json();
    if (j.error){ $('txnote').textContent = 'Failed: ' + j.error; }
    else {
      $('txnote').textContent =
        `${j.speech_s}s sample → ${j.chunks} chunks, ${j.air_s}s on air (${j.realtime}x).`;
    }
  } catch(e){ $('txnote').textContent = 'Sample failed: ' + e.message; }
  setTimeout(()=>{ $('samplebtn').disabled = false; }, 1200);
};

$('rec').addEventListener('pointerdown', e=>{e.preventDefault(); start();});
['pointerup','pointerleave','pointercancel'].forEach(ev=>
  $('rec').addEventListener(ev, stop));
addEventListener('keydown', e=>{
  if (e.code==='Space' && !e.repeat && e.target.tagName!=='INPUT' && e.target.tagName!=='TEXTAREA'){
    e.preventDefault(); start(); }});
addEventListener('keyup', e=>{ if (e.code==='Space') stop(); });

/* ---------- text + file composer ---------- */
function human(n){
  return n < 1024 ? n + ' B'
       : n < 1048576 ? (n/1024).toFixed(1) + ' kB'
       : (n/1048576).toFixed(2) + ' MB';
}
function showCost(el, j, prefix){
  if (!j || j.error){ el.textContent = ''; return; }
  const slow = j.air_s > 60;
  el.innerHTML =
    `${prefix} ${human(j.original_bytes)}`
    + (j.compression !== 'none'
        ? ` → ${human(j.carried_bytes)} ${j.compression}` : ' uncompressed')
    + `<br>${j.chunks} chunks · <b class="${slow?'slow':''}">${j.air_human}</b>`
    + ` on air at ${j.bytes_per_s} B/s`;
}
function debounce(fn, ms){
  let t; return (...a)=>{ clearTimeout(t); t = setTimeout(()=>fn(...a), ms); };
}

const estText = debounce(async ()=>{
  const t = $('txt').value;
  $('sendtxt').disabled = !t.trim();
  if (!t.trim()){ $('txtcost').textContent = ''; return; }
  try {
    const r = await fetch(api('/api/estimate'), {method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({text:t})});
    showCost($('txtcost'), await r.json(), 'Costs');
  } catch(e){ $('txtcost').textContent = ''; }
}, 300);
$('txt').addEventListener('input', estText);

$('sendtxt').onclick = async ()=>{
  const t = $('txt').value.trim(); if (!t) return;
  $('sendtxt').disabled = true;
  try {
    const r = await fetch(api('/api/text'), {method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({text:t})});
    const j = await r.json();
    if (j.error){ $('txtcost').textContent = 'Failed: ' + j.error; }
    else { $('txt').value = ''; $('txtcost').textContent = ''; }
  } catch(e){ $('txtcost').textContent = 'Failed: ' + e.message; }
  estText();
};

$('fileinput').onchange = async ()=>{
  const f = $('fileinput').files[0];
  $('filename').textContent = f ? `${f.name} · ${human(f.size)}` : 'No file chosen';
  $('sendfile').disabled = !f;
  if (!f){ $('filecost').textContent = ''; return; }
  $('filecost').textContent = 'Checking…';
  const fd = new FormData(); fd.append('file', f, f.name);
  try {
    const r = await fetch(api('/api/estimate'), {method:'POST', body: fd});
    const j = await r.json();
    if (j.error){ $('filecost').textContent = j.error; $('sendfile').disabled = true; }
    else { showCost($('filecost'), j, 'Costs'); }
  } catch(e){ $('filecost').textContent = ''; }
};

$('sendfile').onclick = async ()=>{
  const f = $('fileinput').files[0]; if (!f) return;
  $('sendfile').disabled = true;
  const fd = new FormData(); fd.append('file', f, f.name);
  try {
    const r = await fetch(api('/api/file'), {method:'POST', body: fd});
    const j = await r.json();
    if (j.error) $('filecost').textContent = 'Failed: ' + j.error;
  } catch(e){ $('filecost').textContent = 'Failed: ' + e.message; }
};

/* ---------- settings ---------- */
function push(){
  fetch(api('/api/settings'), {method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      auto_repair: $('auto').checked,
      pacing: $('pace').checked,
      mode: $('mode').value || undefined,
      voice_modem: $('voice').value || undefined,
      use_vad: $('vad').checked,
      save: $('save').checked,
      save_modem: $('savemodem').checked,
      impair: {loss_pct:+$('loss').value, snr_db:+$('snr').value,
               fade_prob:+$('fp').value/100, fade_ms:+$('fl').value}
    })});
}
$('loss').oninput = ()=>{ $('lossv').textContent = $('loss').value+'%'; push(); };
$('snr').oninput = ()=>{
  const v = +$('snr').value;
  $('snrv').textContent = v+' dB';
  $('cliff').innerHTML = v < 9.5
    ? '<b>below the 9.5 dB cliff - nothing will decode</b>'
    : 'cliff at 9.5 dB, '+(v-9.5).toFixed(1)+' dB of margin';
  push();
};
$('fp').oninput  = ()=>{ $('fpv').textContent = $('fp').value+'%'; push(); };
$('fl').oninput  = ()=>{ $('flv').textContent = ($('fl').value/1000).toFixed(1)+'s'; push(); };
$('auto').onchange = push; $('pace').onchange = push;
$('vad').onchange = push; $('mode').onchange = ()=>{ push(); refresh(); };
$('voice').onchange = ()=>{ push(); refresh(); };
$('save').onchange = ()=>{ push(); refresh(); };
$('savemodem').onchange = ()=>{ push(); refresh(); };

/* ---------- boot ---------- */
function refresh(){
  return fetch(api('/api/state')).then(r=>r.json()).then(s=>{
    if (s.demo){
      $('samplebtn').hidden = false;
      $('savewrap').hidden = true;
      $('savemodemwrap').hidden = true;
      $('arch').hidden = true;
    }
    CHUNK_S = s.chunk_speech_s;
    $('mycall').textContent = s.call;
    document.title = 'crowcall · ' + s.call;
    $('spec').innerHTML =
      `codec2 ${s.mode} · ${s.frames_per_chunk}x${s.payload_bytes/s.frames_per_chunk}B `+
      `= ${s.chunk_speech_s.toFixed(2)}s/chunk · ${s.realtime_ratio}x realtime<br>` +
      `${s.transport_kind === 'modem' ? s.link.transport : 'raw bursts over udp'} · ` +
      `udp :${s.link.port} · ${s.codec.c2enc ? 'c2enc' : 'ffmpeg libcodec2'}` +
      `${s.codec.vad ? '' : ' · no vad'}`;
    if (!$('mode').options.length){
      s.modes.forEach(m=>{
        const o=document.createElement('option'); o.value=m;
        const g=s.geometry[m];
        o.textContent=`${m} · ${g.bps} bps · ${g.realtime}x`;
        $('mode').append(o);
      });
    }
    MY_MODE = s.mode;
    $('mode').value = s.mode;
    // voice is the one mode the operator picks; hole size is the trade
    const vo = s.voice_options || [];
    if ($('voice').options.length !== vo.length){
      $('voice').innerHTML = '';
      vo.forEach(o=>{
        const el=document.createElement('option'); el.value=o.modem;
        el.textContent=`${o.label} \u00b7 ${o.hole_s}s holes \u00b7 ${o.realtime}x`;
        $('voice').append(el);
      });
    }
    $('voice').value = s.voice_modem;
    const cur = vo.find(o=>o.modem === s.voice_modem);
    $('voicehint').innerHTML = cur
      ? `${cur.aicodix} \u00b7 ${cur.frames} frames \u00b7 ${cur.usable} B per burst`
        + `<br>a lost chunk costs <span class="warn">${cur.hole_s}s</span> of speech`
        + `<br>${cur.why}`
      : '';
    const r = s.rate;
    const bs = Number.isInteger(r.bytes_s) ? r.bytes_s : r.bytes_s.toFixed(1);
    // padding gets its own line: it only applies to 700C and it is the one
    // place where the mode name and the real cost of it disagree
    $('rt').innerHTML =
      `${r.speech_s}s/chunk · ${bs} B/s · ${r.realtime}x realtime`
      + (r.overhead_pct > 0
          ? `<br><span class="warn">${r.wire_bps} bps on air `
            + `(${r.overhead_pct}% frame padding)</span>` : '');
    $('auto').checked = s.auto_repair;
    $('pace').checked = s.pacing;
    $('vad').checked = s.use_vad;
    if (!s.codec.vad){ $('vad').disabled = true; }
    const a = s.archive;
    $('save').checked = a.save;
    $('savemodem').checked = a.save_modem;
    $('savemodem').disabled = !a.save;
    const mb = (a.bytes/1048576);
    $('arch').innerHTML = a.save
      ? `${a.count} saved · ${mb < 1 ? (a.bytes/1024).toFixed(0)+' kB'
                                     : mb.toFixed(1)+' MB'} in ${a.root}`
        + (a.save_modem
            ? `<br><span class="warn">modem audio is ~100 kB per burst</span>`
            : '')
      : 'not saving';
    const modem = s.transport_kind === 'modem';
    $('snrknob').hidden = !modem; $('cliff').hidden = !modem;
    $('lossknob').hidden = modem;
    if (modem && s.impair.snr_db !== undefined){
      $('snr').value = s.impair.snr_db;
      $('snr').dispatchEvent(new Event('input'));
    }
    return s;
  });
}
refresh().then(s=> log('sys',
  `station ${s.call} up, codec2 ${s.mode}, `+
  `${s.transport_kind === 'modem' ? 'real modem' : 'raw bursts'}`));
setInterval(()=>fetch(api('/api/state')).then(r=>r.json()).then(s=>{
  $('fadestate').innerHTML = s.impair.fading
    ? '<span class="fade">channel faded out</span>' : '';
  const a = s.archive, mb = a.bytes/1048576;
  if (a.save) $('arch').innerHTML =
    `${a.count} saved · ${mb < 1 ? (a.bytes/1024).toFixed(0)+' kB'
                                 : mb.toFixed(1)+' MB'} in ${a.root}`
    + (a.save_modem
        ? `<br><span class="warn">modem audio is ~100 kB per burst</span>` : '');
}), 2000);
</script>
</body>
